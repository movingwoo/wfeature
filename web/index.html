<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `black`, not `black-translucent`. A translucent bar makes the web view
         the whole display and lays the page out from the top edge of the glass,
         so the first rows of the game screen come up under a clock and a
         battery — reported from a phone, with the top of two titles' artwork
         behind the status bar. It also reports a viewport shorter than the
         display it just filled, which leaves the page hanging past the bottom.
         An opaque bar puts the page below it and makes the viewport the truth.
         The safe-area padding in style.css covers the case where a browser
         ignores this and hands the page the whole screen anyway. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>wfeature</title>
    <link rel="icon" href="icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" type="module"></script>
  </head>
  <body>
    <!-- Three columns on a wide screen, one on a narrow one. The rails hold the
         panels in both cases: on a narrow screen they carry no layout of their
         own (display: contents) and their panels become centred modals, so the
         same markup serves a phone and a desktop without moving any node. -->
    <div class="stage">
      <aside class="rail rail-left">
        <section class="rail-card log-card">
          <header class="rail-card-head">
            <span>📜 로그</span>
            <button id="log-clear" class="rail-card-action">지우기</button>
          </header>
          <div id="log-view" class="log-view"></div>
        </section>
      </aside>

      <main class="stage-main">
        <div class="canvas-wrapper">
          <canvas id="canvas" width="240" height="320"></canvas>
          <div class="prestart" id="prestart">
            <div class="prestart-row">
              <select id="game-select" class="game-select" disabled>
                <option value="">게임 목록 불러오는 중...</option>
              </select>
              <button id="game-start" class="game-start" disabled>실행</button>
            </div>
            <!-- A phone has no folder to put a game in: Android does not let a
                 file manager open the directory an app keeps its files in. So
                 the archive comes in through the page. The input is hidden
                 because a bare file input says "파일 선택" and nothing about
                 games; the button beside it is what a person reads. -->
            <div class="prestart-row">
              <input type="file" id="game-file" class="game-file" accept=".zip,.jar,application/zip,application/java-archive" multiple />
              <button id="game-add" class="game-add">＋ 게임 추가</button>
              <!-- Only what this page added can go, so the button greys out on
                   a game that was put beside the server by hand. It stays on
                   screen rather than appearing and disappearing with the
                   selection: a control that comes and goes reads as a glitch,
                   and a disabled one says there is a rule. -->
              <button id="game-remove" class="game-add game-remove" disabled>게임 삭제</button>
            </div>
            <!-- The save tree lives beside the server, so from here a player's
                 progress is somewhere they cannot point at — and on a phone it
                 is unreachable for the same reason a game has to arrive through
                 this page. Both buttons act on the game chosen above.

                 They sit here rather than in the settings panel because an
                 import replaces a save, and this is the screen where the game
                 it would replace is not running. -->
            <div class="prestart-row">
              <input type="file" id="save-import-file" class="game-file" accept=".wfs" />
              <button id="save-export" class="game-add save-backup">세이브 내보내기</button>
              <button id="save-import" class="game-add save-backup">세이브 가져오기</button>
            </div>
          </div>

          <div class="prestart hidden" id="session-return" inert>
            <p>다른 화면에서 게임을 진행 중입니다.</p>
            <button id="session-takeover" class="game-start">이 화면에서 이어하기</button>
          </div>

          <!-- One screen for the whole keypad: which shape it is, how much room
               it gets, and which key is in which cell. There were two panels
               and the size one is gone — the two answered halves of the same
               question and each shape wants its own answer to both, so they are
               stored together and set together.

               It is drawn over the game screen rather than listed in the
               settings panel, and on a phone that is the difference between
               choosing and guessing: that panel is a centred modal and covers
               the very keypad being changed. Here the pad stays where it is and
               under a thumb, every drag shows on it, and the screen this panel
               stands on shrinks as the pad grows — which is the other half of
               the trade being made.

               **And the pad is the editor.** While this is open the keypad sends
               nothing and a press picks that cell instead, so what is being
               edited is the thing being looked at. The empty cells a shape
               leaves are shown here and nowhere else; that is where a key goes.

               The slider rows are built in script from the list in
               keypad-size.js and the shape list from keypad-layout.js, so the
               panel cannot come to disagree with either about what there is. -->
          <div class="keypad-arrange" id="keypad-arrange">
            <div class="panel-header">
              <span>🎮 키패드 세부 조정</span>
              <button id="keypad-arrange-close" class="panel-close">완료</button>
            </div>
            <label class="keypad-arrange-shape">타입
              <!-- The shape list lives here rather than in the settings panel,
                   because this is where changing it can be seen: the pad below
                   redraws, and its own size comes back with it. -->
              <select id="keypad-shape-panel" class="game-speed keypad-shape-list">
                <option value="type1" selected>Type1</option>
                <option value="type2">Type2</option>
                <option value="type3">Type3</option>
                <option value="type4">Type4</option>
              </select>
            </label>
            <div id="keypad-size-list" class="keypad-size-list"></div>
            <p class="keypad-arrange-hint" id="keypad-arrange-hint"></p>
            <!-- The picker replaces the hint's place rather than opening over
                 the pad: a list floating on top of the keypad would cover the
                 cell it is a list for. -->
            <div class="keypad-arrange-keys" id="keypad-arrange-keys" hidden></div>
            <!-- One button, and it undoes both halves: the shape's own cells and
                 its own size. Two buttons for the two would leave a person
                 wondering which of them had moved. -->
            <button id="keypad-arrange-reset" class="panel-button">기본값으로 되돌리기</button>
          </div>
        </div>

        <!-- A popup rather than a line in the column: it used to sit here and
             push the keypad down whenever there was anything to say. It stays
             in the markup where it is read from, and the stylesheet takes it
             out of the flow. -->
        <!-- The page asks its own questions rather than calling window.confirm.
             The phone app is a WebView with a WebChromeClient of its own — the
             file picker needs one — and what a JavaScript confirm does there is
             that client's decision; answering "no" with nothing on screen is a
             button that does nothing. The verb goes on the button that carries
             it out, so the last thing read is what is about to happen. -->
        <div id="confirm-dialog" class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-text">
          <span id="confirm-text" class="confirm-text"></span>
          <div class="confirm-actions">
            <button id="confirm-cancel" class="confirm-button">취소</button>
            <button id="confirm-accept" class="confirm-button confirm-accept">확인</button>
          </div>
        </div>

        <dialog id="text-input-dialog" aria-labelledby="text-input-title">
          <h2 id="text-input-title">문자 입력</h2>
          <p id="text-input-status" role="status"></p>
          <label for="text-input-value">게임에 입력할 내용</label>
          <input id="text-input-value" autocomplete="off" />
          <textarea id="text-input-multiline" aria-label="게임에 입력할 내용" hidden></textarea>
          <div class="confirm-actions">
            <button id="text-input-cancel" class="confirm-button">취소</button>
            <button id="text-input-apply" class="confirm-button">입력</button>
          </div>
        </dialog>

        <div id="status-message" class="status-message">
          <!-- The live region is the text, not the popup: the dismiss button
               never changes and would be read out with every message. -->
          <span id="status-text" class="status-text" role="status" aria-live="polite"></span>
          <button id="status-close" class="status-close">확인</button>
        </div>

        <!-- Every key here is a cell rather than a key: the markup says where a
             button sits and `keypad-layout.js` says which phone key is in it,
             so the three keypad shapes are shipped in one table and a person
             can put a key wherever they want it. The label and the data-key are
             filled in from that table on load — a cell holding nothing is
             hidden, which is how a shape leaves nine of these empty.

             What must stay in the markup is the *region*, because `initInput`
             reads it: a button inside the pad's grid is one a sliding finger
             presses on its way across, and one in the band above is aimed at a
             key at a time. Moving a button between the two here would change
             what a drag does with nothing else to say so. And the pad's own
             order is load-bearing twice over — the grid places a cell by where
             its button sits, so reading order is the layout. -->
        <div class="button-container">
          <!-- The band, and it is the pad's seven columns above the pad. It was
               three buttons at hand-written offsets — one at each edge and two
               either side of the centre — which is why there were three of them:
               an absolute position has to be written one at a time. As a row of
               columns there are seven, six of them a person's to fill.

               Opts is the first and is not a cell. It cannot become one: it is
               the only way back into the panel that would undo an empty keypad,
               so no phone key may take it.

               This row is a grid of its own rather than the pad's first row, and
               the reason is the drag rule below: a finger crossing the pad
               presses what it crosses, and up here it aims at one key at a time.
               CLR in the middle of a game is an expensive thing to brush past. -->
          <div class="keypad-band">
            <button id="settings-toggle" class="settings-toggle" aria-label="설정">Opts</button>
            <button class="keypad-cell keypad-band-cell" data-cell="band-c2"></button>
            <button class="keypad-cell keypad-band-cell" data-cell="band-c3"></button>
            <button class="keypad-cell keypad-band-cell" data-cell="band-c4"></button>
            <button class="keypad-cell keypad-band-cell" data-cell="band-c5"></button>
            <button class="keypad-cell keypad-band-cell" data-cell="band-c6"></button>
            <button class="keypad-cell keypad-band-cell" data-cell="band-c7"></button>
          </div>
          <!-- One grid, seven columns by four rows. It was two 3x3 pads with a
               wide gap between them and a row of * 0 # in a band below; the gap
               is a column now and that row is the fourth, so every key is where
               it was and the sixteen cells nothing was using are reachable.

               No cell carries a row or a column: they are emitted in reading
               order and the grid places them, so moving a button here moves it
               on the pad. -->
          <div class="keypad-pad">
              <button class="keypad-cell" data-cell="pad-r1c1"></button>
              <button class="keypad-cell" data-cell="pad-r1c2"></button>
              <button class="keypad-cell" data-cell="pad-r1c3"></button>
              <button class="keypad-cell" data-cell="pad-r1c4"></button>
              <button class="keypad-cell" data-cell="pad-r1c5"></button>
              <button class="keypad-cell" data-cell="pad-r1c6"></button>
              <button class="keypad-cell" data-cell="pad-r1c7"></button>
              <button class="keypad-cell" data-cell="pad-r2c1"></button>
              <button class="keypad-cell" data-cell="pad-r2c2"></button>
              <button class="keypad-cell" data-cell="pad-r2c3"></button>
              <button class="keypad-cell" data-cell="pad-r2c4"></button>
              <button class="keypad-cell" data-cell="pad-r2c5"></button>
              <button class="keypad-cell" data-cell="pad-r2c6"></button>
              <button class="keypad-cell" data-cell="pad-r2c7"></button>
              <button class="keypad-cell" data-cell="pad-r3c1"></button>
              <button class="keypad-cell" data-cell="pad-r3c2"></button>
              <button class="keypad-cell" data-cell="pad-r3c3"></button>
              <button class="keypad-cell" data-cell="pad-r3c4"></button>
              <button class="keypad-cell" data-cell="pad-r3c5"></button>
              <button class="keypad-cell" data-cell="pad-r3c6"></button>
              <button class="keypad-cell" data-cell="pad-r3c7"></button>
              <button class="keypad-cell" data-cell="pad-r4c1"></button>
              <button class="keypad-cell" data-cell="pad-r4c2"></button>
              <button class="keypad-cell" data-cell="pad-r4c3"></button>
              <button class="keypad-cell" data-cell="pad-r4c4"></button>
              <button class="keypad-cell" data-cell="pad-r4c5"></button>
              <button class="keypad-cell" data-cell="pad-r4c6"></button>
              <button class="keypad-cell" data-cell="pad-r4c7"></button>
          </div>
        </div>
      </main>

      <aside class="rail rail-right">
        <div id="settings-panel" class="settings-panel">
          <div class="panel-header">
            <span>⚙️ 설정</span>
            <button id="settings-close" class="panel-close">닫기</button>
          </div>
          <!-- The two sliders are the guest's two sound sources: its MIDI
               sequences, which on these games are the music, and its sampled
               PCM, which is the effects. The labels say what they are for
               rather than what they are made of. -->
          <label>🎵 배경음 <input type="range" id="volume-midi" min="0" max="100" value="50" /></label>
          <label>🔊 효과음 <input type="range" id="volume-pcm" min="0" max="100" value="50" /></label>
          <label>🔍 화질
            <!-- The filters run on the same thread as the emulator and cost more
                 per frame than emulating one does, so the menu says which are
                 affordable rather than leaving that to be discovered. -->
            <select id="frame-scale" class="game-speed">
              <option value="1" selected>원본 (빠름)</option>
              <option value="2">hq2x (느림)</option>
              <option value="3">hq3x (느림)</option>
              <option value="4">hq4x (매우 느림)</option>
            </select>
          </label>
          <label>📱 화면
            <!-- The handset screen the game runs on. Almost every title here
                 was drawn for 240x320 and that is the default; a few were
                 packaged for a smaller phone and load their artwork by the
                 size they are given, so running one on the wrong screen means
                 it asks for pictures its own archive does not contain. It
                 takes effect on the next start, which is why the note says so
                 rather than the setting silently doing nothing.

                 The list is handsets that existed rather than sizes that fit:
                 the two below the default are the phones the older archives
                 were drawn for, and the two above it are the screens the last
                 generation of feature phone carried. A larger one is not
                 a magnifier — that is 확대 — it tells the game it has more
                 room, and what a title does with room it was not drawn for is
                 its own business: some lay their scene out across all of it,
                 some paint their 240x320 picture into the corner and leave the
                 rest black. -->
            <select id="screen-size" class="game-speed">
              <option value="128x160">128 × 160</option>
              <option value="176x220">176 × 220</option>
              <option value="240x320" selected>240 × 320 (기본)</option>
              <option value="240x400">240 × 400</option>
              <option value="320x480">320 × 480</option>
            </select>
          </label>
          <p id="screen-note" class="settings-note hidden"></p>
          <!-- The guest asks the handset to vibrate and the server passes the
               request on; this is where it is decided whether anything
               happens. The row is removed on a browser with no vibrator,
               because a switch that cannot do anything reads as a broken one.
               -->
          <label id="vibrate-row">📳 진동 <input type="checkbox" id="vibrate-toggle" checked /></label>
          <label>⏩ 속도
            <select id="game-speed" class="game-speed">
              <option value="0.25">0.25배</option>
              <option value="0.5">0.5배</option>
              <option value="0.75">0.75배</option>
              <option value="1" selected>1배 (원래 속도)</option>
              <option value="1.5">1.5배</option>
              <option value="2">2배</option>
              <option value="4">4배</option>
            </select>
          </label>
          <label>🎮 키패드 타입
            <!-- The shape, here as well as on the keypad screen. It is the one
                 control of the three that is worth reaching without opening
                 anything: switching between the shapes is a thing somebody does
                 while playing, and the size and the cells are not.

                 Two controls for one setting is a thing to be careful with, and
                 the care is that neither is the one that counts: `initKeypad`
                 drives **every** element carrying `keypad-shape`, so a change
                 at either is the same call and both are redrawn from the stored
                 value afterwards. On a wide window the rail is docked and both
                 are on screen at once, which is where a stale one would show.

                 The list is duplicated in the markup rather than moved into
                 script, because a select the page ships is a select that works
                 before app.js has run. -->
            <select id="keypad-shape-settings" class="game-speed keypad-shape-list">
              <option value="type1" selected>Type1</option>
              <option value="type2">Type2</option>
              <option value="type3">Type3</option>
              <option value="type4">Type4</option>
            </select>
          </label>
          <!-- The rest of the keypad is one screen, and this is the way to it:
               the shape, the measurements and the cells were three controls in
               two places, which meant changing one of them meant finding out
               which place it was in. -->
          <button id="keypad-arrange-open" class="panel-button">🎮 키패드 세부 조정</button>
          <!-- Only where there is a keyboard to press: on a phone this is a
               list of keys nobody can reach, in a panel that has to stay short
               enough for a thumb. It starts hidden everywhere and app.js
               reveals it, since only a key actually arriving proves there is
               one. Folded shut because nineteen rows would otherwise be most
               of the panel. -->
          <details id="key-bindings" class="key-bindings hidden">
            <summary>⌨️ 키보드 매핑 변경</summary>
            <div id="key-bindings-list" class="key-bindings-list"></div>
            <p class="key-bindings-hint">
              키 이름을 누른 다음 새 키를 누르세요. Esc는 취소, ✕는 비우기입니다. 이미 쓰고 있는 키를
              고르면 그 키를 쓰던 자리가 빕니다.
            </p>
            <button id="key-bindings-reset" class="panel-button">기본값으로</button>
          </details>

          <button id="cheat-toggle" class="panel-button hidden">🎯 치트</button>
          <button id="debug-log" class="panel-button hidden">🐞 디버그 로그 저장</button>
          <button id="text-input-toggle" class="panel-button hidden">문자 입력</button>
          <button id="restart" class="panel-button hidden">🔄 재시작</button>
        </div>

        <div id="cheat-panel" class="cheat-panel">
          <div class="cheat-header">
            <span>🎯 치트</span>
            <button id="cheat-close" class="cheat-close">닫기</button>
          </div>

          <div class="cheat-row">
            <select id="cheat-type">
              <option value="u32">u32</option>
              <option value="u16">u16</option>
              <option value="u8">u8</option>
              <option value="i32">i32</option>
              <option value="i16">i16</option>
              <option value="i8">i8</option>
            </select>
            <label class="cheat-check"><input type="checkbox" id="cheat-be" /> BE</label>
            <input id="cheat-value" placeholder="값 (예: 1200, 0x4b0)" />
            <button data-filter="eq">이 값으로 찾기</button>
          </div>

          <div class="cheat-row">
            <button data-filter="unknown">값 모름</button>
            <button data-filter="changed">변함</button>
            <button data-filter="unchanged">안 변함</button>
            <button data-filter="inc">증가</button>
            <button data-filter="dec">감소</button>
            <button data-filter="gt">&gt; 값</button>
            <button data-filter="lt">&lt; 값</button>
          </div>

          <div class="cheat-row">
            <button id="cheat-undo">되돌리기</button>
            <button id="cheat-reset">초기화</button>
            <span id="cheat-count" class="cheat-count">—</span>
          </div>

          <div id="cheat-results" class="cheat-list"></div>

          <div class="cheat-section">고정된 값</div>
          <div id="cheat-frozen" class="cheat-list"></div>

          <div class="cheat-section" id="cheat-watch-section">쓰기 감시</div>
          <div class="cheat-row" id="cheat-watch-row">
            <input id="cheat-watch-address" placeholder="0x40183a2c" />
            <button id="cheat-watch-add">감시 추가</button>
            <button id="cheat-watch-clear">전체 해제</button>
          </div>
          <div id="cheat-hits" class="cheat-list"></div>
          <div class="cheat-section">치트 표</div>
          <div class="cheat-row">
            <button id="cheat-save">저장</button>
            <button id="cheat-load">불러오기</button>
            <input id="cheat-load-file" type="file" accept=".json,application/json" hidden />
          </div>
          <div id="cheat-status" class="cheat-more"></div>
        </div>
      </aside>
    </div>

    <!-- Only ever drawn behind a modal, which is only ever a narrow screen. -->
    <div id="modal-backdrop" class="modal-backdrop"></div>
  </body>
</html>
