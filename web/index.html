<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `black`, not `black-translucent`. A translucent bar makes the web view
         the whole display and lays the page out from the top edge of the glass,
         so the first rows of the game screen come up under a clock and a
         battery — reported from a phone, with the top of two titles' artwork
         behind the status bar. It also reports a viewport shorter than the
         display it just filled, which leaves the page hanging past the bottom.
         An opaque bar puts the page below it and makes the viewport the truth.
         The safe-area padding in style.css covers the case where a browser
         ignores this and hands the page the whole screen anyway. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>wfeature</title>
    <link rel="icon" href="icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css" />
    <!-- Every word on this page is in text.properties. The server fills each
         key in double braces below with its sentence before the page is sent,
         and this element with the whole table, which the scripts read through
         text.js. -->
    <script id="page-text" type="application/json">{{@table}}</script>
    <script src="app.js" type="module"></script>
  </head>
  <body>
    <!-- Three columns on a wide screen, one on a narrow one. The rails hold the
         panels in both cases: on a narrow screen they carry no layout of their
         own (display: contents) and their panels become centred modals, so the
         same markup serves a phone and a desktop without moving any node. -->
    <div class="stage">
      <aside class="rail rail-left">
        <section class="rail-card log-card">
          <header class="rail-card-head">
            <span>{{log.title}}</span>
            <button id="log-clear" class="rail-card-action">{{log.clear}}</button>
          </header>
          <div id="log-view" class="log-view"></div>
        </section>
      </aside>

      <main class="stage-main">
        <div class="canvas-wrapper">
          <canvas id="canvas" width="240" height="320"></canvas>
          <div id="checkpoint-status" class="checkpoint-status" role="status" aria-live="polite" hidden></div>
          <div class="prestart" id="prestart">
            <div class="prestart-row">
              <select id="game-select" class="game-select" disabled>
                <option value="">{{picker.loading}}</option>
              </select>
              <button id="game-start" class="game-start" disabled>{{picker.start}}</button>
            </div>
            <!-- A phone has no folder to put a game in: Android does not let a
                 file manager open the directory an app keeps its files in. So
                 the archive comes in through the page. The input is hidden
                 because a bare file input says "파일 선택" and nothing about
                 games; the button beside it is what a person reads. -->
            <div class="prestart-row">
              <input type="file" id="game-file" class="game-file" accept=".zip,.jar,application/zip,application/java-archive" multiple />
              <button id="game-add" class="game-add">{{add.button}}</button>
              <!-- Only what this page added can go, so the button greys out on
                   a game that was put beside the server by hand. It stays on
                   screen rather than appearing and disappearing with the
                   selection: a control that comes and goes reads as a glitch,
                   and a disabled one says there is a rule. -->
              <button id="game-remove" class="game-add game-remove" disabled>{{remove.button}}</button>
            </div>
            <!-- The save tree lives beside the server, so from here a player's
                 progress is somewhere they cannot point at — and on a phone it
                 is unreachable for the same reason a game has to arrive through
                 this page. Both buttons act on the game chosen above.

                 They sit here rather than in the settings panel because an
                 import replaces a save, and this is the screen where the game
                 it would replace is not running. -->
            <div class="prestart-row">
              <input type="file" id="save-import-file" class="game-file" accept=".wfs" />
              <button id="save-export" class="game-add save-backup">{{savepack.export}}</button>
              <button id="save-import" class="game-add save-backup">{{savepack.import}}</button>
            </div>
          </div>

          <div class="prestart hidden" id="session-return" inert>
            <p>{{resume.elsewhere}}</p>
            <button id="session-takeover" class="game-start">{{resume.takeover}}</button>
          </div>

          <!-- The editor covers the game screen and keeps the keypad visible.
               Empty cells appear only while arranging; guest input is suspended. -->
          <div class="keypad-arrange" id="keypad-arrange">
            <div class="panel-header">
              <span>{{arrange.title}}</span>
              <button id="keypad-arrange-close" class="panel-close">{{arrange.done}}</button>
            </div>
            <label class="keypad-arrange-shape">{{arrange.shape}}
              <select id="keypad-shape-panel" class="game-speed keypad-shape-list">
                <option value="type1" selected>{{keypad.shape.type1}}</option>
                <option value="type2">{{keypad.shape.type2}}</option>
                <option value="type3">{{keypad.shape.type3}}</option>
                <option value="type4">{{keypad.shape.type4}}</option>
              </select>
            </label>
            <div class="keypad-arrange-tools" id="keypad-arrange-tools">
              <button id="keypad-arrange-multiple" type="button" aria-pressed="false">{{arrange.multiple}}</button>
              <button id="keypad-arrange-unselect" type="button">{{arrange.unselect}}</button>
              <button id="keypad-arrange-merge" type="button" disabled>{{arrange.merge}}</button>
              <button id="keypad-arrange-split" type="button" disabled>{{arrange.split}}</button>
              <button id="keypad-arrange-clear" type="button" disabled>{{arrange.clear}}</button>
              <button id="keypad-arrange-undo" type="button" disabled>{{arrange.undo}}</button>
            </div>
            <p id="keypad-arrange-storage" class="keypad-arrange-storage" role="status" hidden></p>
            <p class="keypad-arrange-hint" id="keypad-arrange-hint" role="status"></p>
            <!-- The picker replaces the hint's place rather than opening over
                 the pad: a list floating on top of the keypad would cover the
                 cell it is a list for. -->
            <div class="keypad-arrange-keys" id="keypad-arrange-keys" hidden></div>
            <button id="keypad-arrange-reset" class="panel-button">{{arrange.reset}}</button>
          </div>
        </div>

        <!-- A popup rather than a line in the column: it used to sit here and
             push the keypad down whenever there was anything to say. It stays
             in the markup where it is read from, and the stylesheet takes it
             out of the flow. -->
        <!-- The page asks its own questions rather than calling window.confirm.
             The phone app is a WebView with a WebChromeClient of its own — the
             file picker needs one — and what a JavaScript confirm does there is
             that client's decision; answering "no" with nothing on screen is a
             button that does nothing. The verb goes on the button that carries
             it out, so the last thing read is what is about to happen. -->
        <div id="confirm-dialog" class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-text">
          <span id="confirm-text" class="confirm-text"></span>
          <div class="confirm-actions">
            <button id="confirm-cancel" class="confirm-button">{{confirm.cancel}}</button>
            <button id="confirm-accept" class="confirm-button confirm-accept">{{confirm.accept}}</button>
          </div>
        </div>

        <dialog id="text-input-dialog" aria-labelledby="text-input-title">
          <h2 id="text-input-title">{{textinput.title}}</h2>
          <p id="text-input-status" role="status" aria-live="polite" hidden></p>
          <input id="text-input-value" aria-label="{{textinput.field}}" aria-describedby="text-input-status" autocomplete="off" />
          <textarea id="text-input-multiline" aria-label="{{textinput.field}}" aria-describedby="text-input-status" hidden></textarea>
          <div class="confirm-actions">
            <button id="text-input-cancel" class="confirm-button">{{textinput.cancel}}</button>
            <button id="text-input-apply" class="confirm-button">{{textinput.apply}}</button>
          </div>
        </dialog>

        <div id="status-message" class="status-message">
          <!-- The live region is the text, not the popup: the dismiss button
               never changes and would be read out with every message. -->
          <span id="status-text" class="status-text" role="status" aria-live="polite"></span>
          <button id="status-close" class="status-close">{{status.close}}</button>
        </div>

        <!-- Shapes and cell ownership are rendered from the validated layout. -->
        <div class="button-container">
          <div class="keypad-grid" id="keypad-grid" aria-label="{{keypad.label}}"></div>
        </div>
      </main>

      <aside class="rail rail-right">
        <div id="settings-panel" class="settings-panel">
          <div class="panel-header">
            <span>{{settings.title}}</span>
            <button id="settings-close" class="panel-close">{{settings.close}}</button>
          </div>
          <!-- The two sliders are the guest's two sound sources: its MIDI
               sequences, which on these games are the music, and its sampled
               PCM, which is the effects. The labels say what they are for
               rather than what they are made of. -->
          <label>{{settings.music}} <input type="range" id="volume-midi" min="0" max="100" value="50" /></label>
          <label>{{settings.effects}} <input type="range" id="volume-pcm" min="0" max="100" value="50" /></label>
          <label>{{settings.quality}}
            <!-- The filters run on the same thread as the emulator and cost more
                 per frame than emulating one does, so the menu says which are
                 affordable rather than leaving that to be discovered. -->
            <select id="frame-scale" class="game-speed">
              <option value="1" selected>{{settings.quality.1}}</option>
              <option value="2">{{settings.quality.2}}</option>
              <option value="3">{{settings.quality.3}}</option>
              <option value="4">{{settings.quality.4}}</option>
            </select>
          </label>
          <label>{{settings.screen}}
            <!-- The handset screen the game runs on. Almost every title here
                 was drawn for 240x320 and that is the default; a few were
                 packaged for a smaller phone and load their artwork by the
                 size they are given, so running one on the wrong screen means
                 it asks for pictures its own archive does not contain. It
                 takes effect on the next start, which is why the note says so
                 rather than the setting silently doing nothing.

                 The list is handsets that existed rather than sizes that fit:
                 the two below the default are the phones the older archives
                 were drawn for, and the two above it are the screens the last
                 generation of feature phone carried. A larger one is not
                 a magnifier — that is 확대 — it tells the game it has more
                 room, and what a title does with room it was not drawn for is
                 its own business: some lay their scene out across all of it,
                 some paint their 240x320 picture into the corner and leave the
                 rest black. -->
            <select id="screen-size" class="game-speed">
              <option value="128x160">128 × 160</option>
              <option value="176x220">176 × 220</option>
              <option value="240x320" selected>{{settings.screen.default}}</option>
              <option value="240x400">240 × 400</option>
              <option value="320x480">320 × 480</option>
            </select>
          </label>
          <p id="screen-note" class="settings-note hidden"></p>
          <!-- The guest asks the handset to vibrate and the server passes the
               request on; this is where it is decided whether anything
               happens. The row is removed on a browser with no vibrator,
               because a switch that cannot do anything reads as a broken one.
               -->
          <label id="vibrate-row">{{settings.vibrate}} <input type="checkbox" id="vibrate-toggle" checked /></label>
          <label>{{settings.speed}}
            <select id="game-speed" class="game-speed">
              <option value="0.25">{{settings.speed.0.25}}</option>
              <option value="0.5">{{settings.speed.0.5}}</option>
              <option value="0.75">{{settings.speed.0.75}}</option>
              <option value="1" selected>{{settings.speed.1}}</option>
              <option value="1.5">{{settings.speed.1.5}}</option>
              <option value="2">{{settings.speed.2}}</option>
              <option value="4">{{settings.speed.4}}</option>
            </select>
          </label>
          <label>{{settings.shape}}
            <!-- The shape, here as well as on the keypad screen. It is the one
                 control of the three that is worth reaching without opening
                 anything: switching between the shapes is a thing somebody does
                 while playing, and the size and the cells are not.

                 Two controls for one setting is a thing to be careful with, and
                 the care is that neither is the one that counts: `initKeypad`
                 drives **every** element carrying `keypad-shape`, so a change
                 at either is the same call and both are redrawn from the stored
                 value afterwards. On a wide window the rail is docked and both
                 are on screen at once, which is where a stale one would show.

                 The list is duplicated in the markup rather than moved into
                 script, because a select the page ships is a select that works
                 before app.js has run. -->
            <select id="keypad-shape-settings" class="game-speed keypad-shape-list">
              <option value="type1" selected>{{keypad.shape.type1}}</option>
              <option value="type2">{{keypad.shape.type2}}</option>
              <option value="type3">{{keypad.shape.type3}}</option>
              <option value="type4">{{keypad.shape.type4}}</option>
            </select>
          </label>
          <!-- The rest of the keypad is one screen, and this is the way to it:
               the shape, the measurements and the cells were three controls in
               two places, which meant changing one of them meant finding out
               which place it was in. -->
          <button id="keypad-arrange-open" class="panel-button">{{settings.arrange}}</button>
          <!-- 전체화면 puts the keypad away and gives the game screen the
               window: for a game controller or a keyboard, the keypad is only
               what keeps the screen small. The label says which way a press
               goes; app.js keeps it true. -->
          <button id="fullscreen-toggle" class="panel-button" aria-pressed="false">{{fullscreen.enter}}</button>
          <!-- Only where there is a keyboard to press: on a phone this is a
               list of keys nobody can reach, in a panel that has to stay short
               enough for a thumb. It starts hidden everywhere and app.js
               reveals it, since only a key actually arriving proves there is
               one. Folded shut because nineteen rows would otherwise be most
               of the panel. -->
          <details id="key-bindings" class="key-bindings hidden">
            <summary>{{keyboard.title}}</summary>
            <div id="key-bindings-list" class="key-bindings-list"></div>
            <p class="key-bindings-hint">{{keyboard.hint}}</p>
            <button id="key-bindings-reset" class="panel-button">{{keyboard.reset}}</button>
          </details>
          <!-- The same rule for a game controller: hidden until one has been
               used here, because a browser does not show a controller to a
               page before one of its buttons is pressed. A row per control
               rather than per phone key — a controller has a fixed set of
               them, and the direction pad and the left stick both send the
               direction keys. A row lights while its control is held. -->
          <details id="pad-bindings" class="key-bindings hidden">
            <summary>{{pad.title}}</summary>
            <p id="pad-bindings-status" class="key-bindings-hint" role="status"></p>
            <div id="pad-bindings-list" class="key-bindings-list pad-bindings-list"></div>
            <p class="key-bindings-hint">{{pad.hint}}</p>
            <button id="pad-bindings-reset" class="panel-button">{{pad.reset}}</button>
          </details>

          <button id="cheat-toggle" class="panel-button hidden">{{settings.cheat}}</button>
          <button id="debug-log" class="panel-button hidden">{{settings.debug-log}}</button>
          <button id="text-input-toggle" class="panel-button hidden">{{settings.text-input}}</button>
          <button id="restart" class="panel-button hidden">{{settings.restart}}</button>
        </div>

        <div id="cheat-panel" class="cheat-panel">
          <div class="cheat-header">
            <span>{{cheat.title}}</span>
            <button id="cheat-close" class="cheat-close">{{cheat.close}}</button>
          </div>

          <div class="cheat-row">
            <select id="cheat-type">
              <option value="u32">u32</option>
              <option value="u16">u16</option>
              <option value="u8">u8</option>
              <option value="i32">i32</option>
              <option value="i16">i16</option>
              <option value="i8">i8</option>
            </select>
            <label class="cheat-check"><input type="checkbox" id="cheat-be" /> BE</label>
            <input id="cheat-value" placeholder="{{cheat.value}}" />
            <button data-filter="eq">{{cheat.filter.eq}}</button>
          </div>

          <div class="cheat-row">
            <button data-filter="unknown">{{cheat.filter.unknown}}</button>
            <button data-filter="changed">{{cheat.filter.changed}}</button>
            <button data-filter="unchanged">{{cheat.filter.unchanged}}</button>
            <button data-filter="inc">{{cheat.filter.inc}}</button>
            <button data-filter="dec">{{cheat.filter.dec}}</button>
            <button data-filter="gt">{{cheat.filter.gt}}</button>
            <button data-filter="lt">{{cheat.filter.lt}}</button>
          </div>

          <div class="cheat-row">
            <button id="cheat-undo">{{cheat.undo}}</button>
            <button id="cheat-reset">{{cheat.reset}}</button>
            <span id="cheat-count" class="cheat-count">—</span>
          </div>

          <div id="cheat-results" class="cheat-list"></div>

          <div class="cheat-section">{{cheat.frozen}}</div>
          <div id="cheat-frozen" class="cheat-list"></div>

          <div class="cheat-section" id="cheat-watch-section">{{cheat.watch}}</div>
          <div class="cheat-row" id="cheat-watch-row">
            <input id="cheat-watch-address" placeholder="0x40183a2c" />
            <button id="cheat-watch-add">{{cheat.watch.add}}</button>
            <button id="cheat-watch-clear">{{cheat.watch.clear}}</button>
          </div>
          <div id="cheat-hits" class="cheat-list"></div>
          <div class="cheat-section">{{cheat.table}}</div>
          <div class="cheat-row">
            <button id="cheat-save">{{cheat.table.save}}</button>
            <button id="cheat-load">{{cheat.table.load}}</button>
            <input id="cheat-load-file" type="file" accept=".json,application/json" hidden />
          </div>
          <div id="cheat-status" class="cheat-more"></div>
        </div>
      </aside>
    </div>

    <!-- The way back from 전체화면, against the picture's top-right corner —
         just above it, or just beside it when the picture takes the whole
         height; that layout leaves room for one of the two at every window
         shape. Drawn only in it, and under any modal. -->
    <button id="fullscreen-exit" class="fullscreen-exit" type="button" aria-label="{{fullscreen.exit}}" title="{{fullscreen.exit}}">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" />
      </svg>
    </button>

    <!-- Only ever drawn behind a modal, which is a narrow screen or 전체화면. -->
    <div id="modal-backdrop" class="modal-backdrop"></div>
  </body>
</html>
