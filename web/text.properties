# Every sentence and label a player reads on the page, in one file.
#
# One `key = value` per line, and a line that starts with # is a comment. The
# value is the rest of the line as written, without the spaces around it:
# there are no escapes and no continuation lines. A {name} in a value is
# filled in when the sentence is shown, from what the code that asks for it
# passes; a value with none is shown as it is.
#
# The server reads this file. It fills each {{key}} in index.html from it,
# hands the whole table to the scripts (text.js), and answers the page from it
# (internal/webhost/text.go). A development server (-web web) shows an edit on
# the next reload; a release carries the file inside its binary.
#
# Keys are named for where their text appears. text.test.mjs fails on a key the
# page or the server asks for that is missing here, on a key here that nothing
# asks for, and on player text written anywhere but here.

# Phone keys and the page's own controls, as the keypad, the keypad editor,
# the keyboard list and the game controller list name them. The digits, * and
# # are their own names. The right soft key is named for where it sat, because
# the titles' help screens only ever call it 우측상단키.
key.CLR = 취소
key.CALL = 통화
key.MENU = 메뉴
key.SOFT2 = 우상단
key.UP = ↑
key.DOWN = ↓
key.LEFT = ←
key.RIGHT = →
key.OK = 확인
key.SETTINGS = 설정
key.RAPID_FIRE = 연사
key.QUICK_SAVE = 퀵세이브
key.QUICK_LOAD = 퀵로드
key.FULLSCREEN = 전체화면
# What the centre key's own button says; everywhere else it is key.OK.
key.face.OK = OK

