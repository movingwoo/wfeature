# The checks a change has to pass, run on every pull request and every push to
# main. What they are lives in checks.yml, which `release` calls too so that a
# tag cannot publish something this never saw.
name: verify

# A push to a branch with a pull request open used to run everything twice,
# once for the push and once for the pull request, on the same commit. The pull
# request run is the one that sees the merge with main, so it is the one kept;
# main's own push stays because that run is what writes the build cache the
# next pull request starts from. A branch pushed without a pull request runs
# nothing until one is opened, or until it is started by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes anything back: the checks read the tree, build it and run
# it. A pull request from a fork gets a read token regardless, but a push to a
# branch here does not, and the default is every scope the repository allows.
permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
