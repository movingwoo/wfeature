# The checks a change has to pass, run on every push and pull request. What
# they are lives in checks.yml, which `release` calls too so that a tag cannot
# publish something this never saw.
name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Nothing here writes anything back: the checks read the tree, build it and run
# it. A pull request from a fork gets a read token regardless, but a push to a
# branch here does not, and the default is every scope the repository allows.
permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
