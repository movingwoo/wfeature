# Everything a change has to pass, in one place because two workflows need it:
# `verify` runs it on every push, and `release` runs it before it publishes. A
# release that skipped the per-OS run would ship a Windows binary nobody had
# ever started — cross-compiling proves a build, not a run.
#
# This is called rather than triggered: it has no `on:` of its own beyond
# workflow_call. See docs/running.md, "What was verified, and where".
#
# **Every action is pinned to a commit, with the version it was at in a comment
# beside it.** A tag is a name its owner can move: `@v7` is whatever that
# repository decides `v7` means the next time this runs, and the release
# workflow calls this one, so an action that changed under a tag would be
# building the binaries people download. The comment is what Dependabot reads
# to offer the next version — see .github/dependabot.yml.
name: checks

on:
  workflow_call:

# The job needs the checkout and nothing else. A reusable workflow is handed
# the caller's token, and the caller here is the release workflow, whose own
# job writes releases; declaring the floor here means that token cannot reach
# this far even if the caller's grows.
permissions:
  contents: read

defaults:
  run:
    # One script per step across all three runners; the Windows runners have
    # bash, and the Makefile is a POSIX shell script in disguise anyway.
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest released Go rather than the one go.mod names. go.mod's
          # directive is the floor a checkout has to clear; what CI builds
          # with is a decision about what gets shipped, and these runners
          # build the release binaries. Pinned to the floor it was 1.25.0,
          # whose standard library has holes with fixes already out — which
          # is what govulncheck reported, correctly, about binaries users
          # would have downloaded.
          go-version: stable
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          # This repository has no npm dependencies — the Node tests import
          # nothing but `node:test` — so there is nothing to restore and no
          # lock file to key a cache on. Said explicitly because the action
          # caches by itself when a package.json declares a package manager,
          # and a cache step that fails for want of a lock file would fail a
          # job that does not need one.
          package-manager-cache: false

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l cmd internal mobile)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      # A game archive is untrusted input and the decoders it reaches are
      # third-party, so a known vulnerability in one of them is this project's
      # to carry: a bitmap that panicked the process would take every other
      # session in it down. govulncheck reports only what is actually reachable
      # from this code, so a finding here is one this build can be made to hit.
      - name: Check for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Both profiles, because the debug build tag changes real behaviour.
      - run: make test
      - run: make test-debug
      - run: go test -race ./internal/...

  # A release is "the server binary for an OS, a folder to drop games into, and
  # a browser", so what has to be verified per OS is that the binary starts,
  # binds, and serves the page it carries. No game archive is involved: none
  # can be committed here, and the platforms are exercised by the test job.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        # `go build -o <name>` writes exactly that name, so Windows has to ask
        # for the extension itself or the file it produces cannot be run.
        include:
          - os: ubuntu-latest
            binary: wfeature-server
          - os: windows-latest
            binary: wfeature-server.exe
          - os: macos-latest
            binary: wfeature-server
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest released Go rather than the one go.mod names. go.mod's
          # directive is the floor a checkout has to clear; what CI builds
          # with is a decision about what gets shipped, and these runners
          # build the release binaries. Pinned to the floor it was 1.25.0,
          # whose standard library has holes with fixes already out — which
          # is what govulncheck reported, correctly, about binaries users
          # would have downloaded.
          go-version: stable
          cache: true

      # The Android app runs this same binary as a child process, so what has
      # to hold is that it still cross-compiles for a phone. Seconds, and no
      # Android SDK involved.
      - name: The Android app's server cross-compiles
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "0"
          GOOS: android
          GOARCH: arm64
        run: go build -o /dev/null ./cmd/server

      # iOS cannot run a child process, so its half is a linked archive and a
      # Swift app that calls into it. Compiling both is what catches an export
      # that was renamed on one side of that boundary — the failure that would
      # otherwise surface as an app nobody can build the week of a release.
      - name: The iOS library and app compile
        if: runner.os == 'macOS'
        run: |
          set -eu
          mkdir -p build/ci
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
            CC="$(xcrun --sdk iphoneos -f clang) -arch arm64 -isysroot $sdk -miphoneos-version-min=14.0" \
            go build -buildmode=c-archive -o build/ci/libwfeature.a ./mobile/ios/lib
          printf '#include "libwfeature.h"\n' > build/ci/bridge.h
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios14.0 -sdk "$sdk" \
            -import-objc-header build/ci/bridge.h -I build/ci \
            -parse-as-library \
            -framework UIKit -framework WebKit -framework Foundation \
            mobile/ios/src/App.swift build/ci/libwfeature.a \
            -o build/ci/wfeature

      - name: Build the release server
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w -X main.version=ci" -o build/smoke/${{ matrix.binary }} ./cmd/server

      # The archive layout is what makes the binary choose the folder beside it
      # as its data root rather than whatever directory it was started from.
      - name: Stage it the way an archive does
        run: mkdir -p build/smoke/games/ktf build/smoke/games/lgt build/smoke/games/skt

      - name: It reports its version
        run: |
          cd build/smoke
          ./${{ matrix.binary }} -version | tee version.txt
          grep -q "wfeature-server ci (release)" version.txt

      - name: It serves what it carries
        run: |
          cd build/smoke
          ./${{ matrix.binary }} -addr 127.0.0.1:11541 > server.log 2>&1 &
          server=$!
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:11541/api/status -o status.json; then
              break
            fi
            sleep 1
          done
          cat server.log
          # The status endpoint answers JSON, and the root is the client page.
          cat status.json; echo
          grep -q "{" status.json
          curl -fsS http://127.0.0.1:11541/ -o index.html
          grep -qi "<html" index.html
          # The data root is the folder beside the binary, which is what keeps
          # a release from writing saves into the directory it was started in.
          grep -q "beside the executable" server.log

          # The launcher scripts beside a release are a line each: the work is
          # the two commands below. Windows is the reason they are checked
          # here — it is the one system where a stop cannot fall back to a
          # signal, so the route the server answers is the whole of it there.
          ./${{ matrix.binary }} status | tee status.txt
          grep -q "11541" status.txt
          ./${{ matrix.binary }} stop | tee stopped.txt
          for attempt in $(seq 1 20); do
            if ! curl -fsS --max-time 2 http://127.0.0.1:11541/api/status -o /dev/null; then
              break
            fi
            sleep 1
          done
          # Nothing is on the port any more, and the server says so itself.
          ./${{ matrix.binary }} status | tee gone.txt
          grep -q "11541" gone.txt
          if curl -fsS --max-time 2 http://127.0.0.1:11541/api/status -o /dev/null; then
            echo "the server is still serving after stop"; exit 1
          fi
          # It drained rather than being killed: the log carries the same line
          # a Ctrl-C leaves.
          grep -q "shutting down" server.log
          wait "$server" || true
